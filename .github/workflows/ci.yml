name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MINT_VERSION: 4.3.19

jobs:
  validate:
    name: mint validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes mint@${MINT_VERSION} validate

  broken-links:
    name: mint broken-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes mint@${MINT_VERSION} broken-links

  line-ui-assets:
    name: line-ui assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/line-ui.mjs --check

  content-guards:
    name: leak lint, sync registry and generated pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun scripts/leak-lint.ts
      - run: bun scripts/sync.ts --validate
      - run: bun scripts/gen.ts --check
      - run: bun scripts/nav.ts --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
