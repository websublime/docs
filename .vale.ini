# Vale config for the Mintlify vale-spellcheck CI check (knowledge/research/mintlify-platform.md).
# This mirrors Mintlify's default config, with three changes:
# - the styles live in .vale/, because styles/ holds the site CSS;
# - the websublime vocabulary is added. Add project terms to
#   .vale/config/vocabularies/websublime/accept.txt (one regex per line);
# - the `{...}` block ignore matches one line only. Mintlify's `(?sm)^({.+.*})`
#   runs from a line starting with `{` (such as a JSON code block) to the end of
#   the file, which breaks code-fence detection and exposes code to the speller.
StylesPath = .vale
MinAlertLevel = suggestion
IgnoredScopes = code, tt, img, url, a
SkippedScopes = script, style, pre, figure
Vocab = Mintlify, websublime

[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale
Vale.Terms = NO
TokenIgnores = (?sm)((?:import|export) .+?$), \
(?<!`)(<\w+ ?.+ ?\/>)(?!`), \
(<[A-Z]\w+>.+?<\/[A-Z]\w+>), \
\{[^}]*\}
BlockIgnores = (?sm)^(<\w+\n .*\s\/>)$, \
(?m)^(\{[^\n]*\})$
